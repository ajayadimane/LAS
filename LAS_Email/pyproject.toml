[project]
name = "las-email"
version = "0.1.0"
description = "LAS email intake for Integra Micro: reads BD mail, extracts it, hands it to Core LAS"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "celery[redis]>=5.4,<5.7",  # 5.7 needs kombu 5.7, which needs Redis >= 6.2 (ZRANGE BYSCORE); Ubuntu 22.04 ships 6.0
    "kombu<5.7",
    "redis>=5.0",
    "structlog>=24.4",
    "python-magic>=0.4.27",
    "clamd>=1.0.2",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "authres>=1.2",
    "dkimpy>=1.1",
    "pyspf>=2.0.14",
    "dnspython>=2.6",
    "google-genai>=1.0",
    "openpyxl>=3.1",
    "cryptography>=43",
    "liteparse>=2.14.7,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "types-redis",
    "celery-types",
    "pillow",
    "pikepdf>=9.0",  # tests/docs.py builds password-protected PDFs
]

[project.scripts]
las-ingest = "las.ingest.listener:main"
las-seed = "las.scripts.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["las"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP", "S", "ASYNC", "RUF", "SIM", "PL"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
    "S101", "S311", "RUF001", "RUF002", "RUF003",
    "E501",     # ruff format owns wrapping; remaining long lines are strings
    "PLC0415",  # deliberate lazy imports: optional SDKs, import cycles, fast CLI start
    "PLW0603",  # module-level singletons (engine, runner) are intentional
    "ASYNC109", # interface methods take an explicit timeout by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLC0415", "PLR"]

[tool.mypy]
strict = true
python_version = "3.10"
packages = ["las"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "authres.*", "dkim.*", "spf", "clamd", "magic", "fitz", "pymupdf",
    "weasyprint", "openpyxl.*", "liteparse.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "commits: test needs real commits (outbox, advisory locks, concurrency); tables truncated",
    "imap: needs an IMAP server (in-process fake by default)",
]
filterwarnings = ["ignore::DeprecationWarning:celery.*"]

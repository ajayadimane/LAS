# Local dev services only. PostgreSQL is the developer's local server (see .env).
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  clamav:
    image: clamav/clamav:stable
    ports: ["3310:3310"]
  greenmail:      # IMAP server for manual adapter testing
    image: greenmail/standalone:2.1.0
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.users=las:las@integramicro.co.in -Dgreenmail.hostname=0.0.0.0"
    ports: ["3143:3143", "3025:3025"]

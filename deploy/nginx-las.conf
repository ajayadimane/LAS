# LAS on the demo server: UI at /las/, middleware at /las-api/ (docker-compose.yaml).
# Paste these location blocks inside your existing `server { ... }` block (or
# include this file from it), then: sudo nginx -t && sudo systemctl reload nginx
#
# 8110 = the frontend (Vite dev server), 8109 = the backend API; both listen on
# 127.0.0.1 only, so this nginx is the one public entry point.
# The paths must match: VITE_BASE_PATH=/las, VITE_API_BASE_PATH and the
# backend's CONTEXT_PATH=/las-api (all set in docker-compose.yaml).

location = /las {
    return 301 /las/;
}

# The UI. The dev server is started with base /las/, so the path is forwarded
# unchanged (no trailing slash on proxy_pass). Upgrade/Connection carry Vite's
# live-reload websocket; without them the page still works but logs errors.
location /las/ {
    proxy_pass http://127.0.0.1:8110;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
}

# Service-to-service only: LAS_Email posts its events straight to
# 127.0.0.1:8109 on this server, never through nginx. Keep the path off the
# internet (the API key alone should not be all that guards it).
location ^~ /las-api/internal/ {
    return 404;
}

# The FastAPI middleware. No trailing slash on proxy_pass: the full path,
# /las-api/..., is forwarded unchanged, which is what CONTEXT_PATH expects.
location /las-api/ {
    proxy_pass http://127.0.0.1:8109;

    # The middleware forwards the first X-Forwarded-For entry to the vendor as
    # the end user's IP. Overwrite it (not $proxy_add_x_forwarded_for), so a
    # browser cannot supply its own.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Documents are uploaded as the raw file, up to DOCUMENT_MAX_BYTES (5 MB in
    # the demo .env); nginx's default is 1 MB. Keep this a little above it.
    client_max_body_size 6m;

    # Vendor calls time out at 10 s, a few in a row on one request.
    proxy_read_timeout 60s;
}

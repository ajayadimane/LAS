# LAS dashboard: UI at /las/, middleware at /las-api/.
# Paste these two location blocks inside your existing `server { ... }` block
# (or include this file from it), then: sudo nginx -t && sudo systemctl reload nginx
#
# /var/www/las holds the built UI (the contents of frontend/dist) and 9000 is
# the backend's PORT; change both here if the server differs.
# The paths must match the build: VITE_BASE_PATH=/las, VITE_API_BASE_PATH and
# the backend's CONTEXT_PATH=/las-api.

location = /las {
    return 301 /las/;
}

# The built UI. Any path that is not a real file falls back to index.html, so
# a refresh on /las/bd/customers loads the app, not a 404.
location /las/ {
    alias /var/www/las/;
    try_files $uri $uri/ /las/index.html;

    # index.html must never be cached (it names the current asset files);
    # the hashed assets can be cached for good.
    location /las/assets/ {
        alias /var/www/las/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# The FastAPI middleware. No trailing slash on proxy_pass: the full path,
# /las-api/..., is forwarded unchanged, which is what CONTEXT_PATH expects.
location /las-api/ {
    proxy_pass http://127.0.0.1:9000;

    # The middleware forwards the first X-Forwarded-For entry to the vendor as
    # the end user's IP. Overwrite it (not $proxy_add_x_forwarded_for), so a
    # browser cannot supply its own.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Documents are up to 2 MB (DOCUMENT_MAX_BYTES); nginx's default is 1 MB.
    client_max_body_size 5m;

    # Vendor calls time out at 10 s, a few in a row on one request.
    proxy_read_timeout 60s;
}

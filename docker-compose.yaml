version: '3'

# One container: the backend API (8109, which also runs the DPR worker as its
# child, DPR_WORKER_AUTOSTART) and the frontend dev server (8110).
#
#   docker compose run --rm fraud python scripts/migrate.py   # tables; every deploy
#   docker compose up -d --build
#
# Security: both ports listen on 0.0.0.0. Keep 8109 and 8110 closed in the
# firewall so only nginx reaches them; if nginx runs on this server, change both
# --host values to 127.0.0.1. Vite's dev server can be tricked into reading
# files (including /las/.env), and the API trusts X-Forwarded-For from nginx.

services:
  fraud:
    build: .
    container_name: las
    network_mode: "host"
    restart: always

    env_file:
      - .env

    environment:
      # The API starts and restarts scripts/dpr_worker.py itself.
      DPR_WORKER_AUTOSTART: "true"
      # The frontend's paths; must match nginx and the backend's CONTEXT_PATH.
      VITE_BASE_PATH: /las
      VITE_API_BASE_PATH: /las-api
      VITE_API_PROXY_TARGET: http://127.0.0.1:8109

    volumes:
      - ./:/las/
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"

    command:
      - /bin/bash
      - -c
      - |
          cd /las/

          uvicorn app.main:app --host 0.0.0.0 --port 8109 &

          cd /las/frontend/
          npm ci --no-audit --no-fund
          npm run dev -- --host 0.0.0.0 --port 8110 &

          # Exit when either process dies, so restart: always brings both back.
          wait -n
